{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'train' %}<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M12 3v8M8 21l2-3m6 3-2-3M8 15h.01M16 15h.01"/>
{% elif name == 'pin' %}<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-12 4h.01m6 0h.01"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'swap' %}<path d="M3 7h17m-4-4 4 4-4 4M21 17H4m4-4-4 4 4 4"/>
{% elif name == 'seat' %}<path d="M7 3v8a3 3 0 0 0 3 3h8v5H6V9M6 19v2m12-2v2M10 10h7"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'ticket' %}<path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4V7Z"/><path d="M15 7v3m0 3v3m0 2v1"/>
{% endif %}</svg>
{%- endmacro %}
